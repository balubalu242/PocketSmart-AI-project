{% extends "base.html" %}
{% block title %}Register — PocketSmart AI{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form class="card form-card" method="post" action="/register">
    <p class="eyebrow">GET STARTED</p>
    <h1>Create your account</h1>
    <label>Full name<input name="full_name" required minlength="2" autocomplete="name"></label>
    <label>Email<input type="email" name="email" required autocomplete="email"></label>
    <label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn" type="submit">Create account</button>
    <p class="muted">Already registered? <a href="/login">Log in</a>.</p>
  </form>
</div>
{% endblock %}
